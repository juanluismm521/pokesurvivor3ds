# Servidor de los paquetes de datos (lo que la 3DS baja sola, ver
# tools/web/publicar_datos.sh). Sólo sirve archivos, de sólo lectura.
#
# En el VPS vive en /root/docker/pokesurvivor-datos (copia de esta carpeta):
#   docker compose up -d
# y Caddy (que ya tiene el HTTPS) le pasa https://pokesurvivor3ds.duckdns.org/datos/...
# (ver Caddyfile.bloque). Los paquetes van en ./www/datos/.
services:
  datos:
    image: nginx:alpine
    container_name: pokesurvivor-datos
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - caddy_net
    logging:
      options:
        max-size: "5m"
        max-file: "2"

networks:
  caddy_net:
    external: true
